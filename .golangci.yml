run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gofmt
    - goimports
    - misspell
    - depguard

linters-settings:
  depguard:
    rules:
      main:
        deny:
          - pkg: "github.com/jmoiron/sqlx"
            desc: "use pgx/v5 directly"
        list-mode: lax
  goimports:
    local-prefixes: todo

issues:
  exclude-use-default: false
